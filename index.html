<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prijava na poslovni dogodek | Jadek & Pensa</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <img src="assets/img/logo.png" alt="Jadek & Pensa" class="logo">
  </header>

  <main class="page">
    <h1>PRIJAVA NA POSLOVNI DOGODEK</h1>
    <p class="event-name">Med priložnostjo in tveganjem: pravni in davčni vidiki nepremičninskih investicij</p>
    <p class="event-meta">Golf Resort Arboretum, četrtek, 1. oktober 2026</p>

    <form id="registration-form" class="registration-form" novalidate>
      <!-- Honeypot polje - skrito za uporabnike, aktivno za bote -->
      <div class="honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="ime-priimek">Ime in priimek <span class="required">*</span></label>
        <input type="text" id="ime-priimek" name="ime-priimek" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">E-poštni naslov <span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="podjetje">Podjetje <span class="required">*</span></label>
        <input type="text" id="podjetje" name="podjetje" autocomplete="organization" required>
      </div>

      <div class="form-group">
        <label for="funkcija">Funkcija <span class="required">*</span></label>
        <input type="text" id="funkcija" name="funkcija" autocomplete="organization-title" required>
      </div>

      <div class="form-group">
        <label for="prehrana">Prehranske omejitve</label>
        <input type="text" id="prehrana" name="prehrana" autocomplete="off">
      </div>

      <fieldset class="form-group checkbox-fieldset">
        <legend>Ali se nameravate dogodka udeležiti z dodatnim gostom? <span class="required">*</span></legend>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="radio" id="dodatni-gost-da" name="dodatni-gost" value="Da" required>
            <label for="dodatni-gost-da">Da</label>
          </div>
          <div class="checkbox-item">
            <input type="radio" id="dodatni-gost-ne" name="dodatni-gost" value="Ne" required>
            <label for="dodatni-gost-ne">Ne</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="guest-fields" id="gost-podatki" hidden>
        <legend>Podatki o gostu</legend>

        <div class="form-group">
          <label for="gost-ime-priimek">Ime in priimek <span class="required">*</span></label>
          <input type="text" id="gost-ime-priimek" name="gost-ime-priimek" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="gost-podjetje">Podjetje <span class="required">*</span></label>
          <input type="text" id="gost-podjetje" name="gost-podjetje" autocomplete="organization" required>
        </div>

        <div class="form-group">
          <label for="gost-funkcija">Funkcija <span class="required">*</span></label>
          <input type="text" id="gost-funkcija" name="gost-funkcija" autocomplete="organization-title" required>
        </div>

        <div class="form-group">
          <label for="gost-email">E-poštni naslov <span class="required">*</span></label>
          <input type="email" id="gost-email" name="gost-email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="gost-prehrana">Prehranske omejitve</label>
          <input type="text" id="gost-prehrana" name="gost-prehrana" autocomplete="off">
        </div>
      </fieldset>

      <div class="form-group">
        <label for="opombe">Opombe</label>
        <textarea id="opombe" name="opombe" rows="4"></textarea>
      </div>

      <div class="form-group form-group-checkbox">
        <input type="checkbox" id="soglasje-obdelava" name="soglasje-obdelava" required>
        <label for="soglasje-obdelava">
          Strinjam se, da Odvetniška pisarna Jadek &amp; Pensa, d.o.o. moje osebne podatke iz tega obrazca obdeluje za namen
          organizacije in izvedbe dogodka (vključno z morebitnim pošiljanjem gradiv po dogodku). Podatki bodo hranjeni
          2 leti in ne bodo posredovani tretjim osebam brez pravne podlage. <span class="required">*</span>
        </label>
      </div>

      <div class="form-group form-group-checkbox">
        <input type="checkbox" id="soglasje-foto" name="soglasje-foto" required>
        <label for="soglasje-foto">
          Strinjam se s fotografiranjem in snemanjem dogodka ter objavo slikovnega gradiva na kanalih Jadek &amp; Pensa
          in Real Estate Academy. <span class="required">*</span>
        </label>
      </div>

      <div id="form-error" class="form-error" hidden></div>

      <button type="submit" id="submit-button" class="submit-button">Prijava</button>
    </form>

    <div id="confirmation-message" class="confirmation-message" hidden>
      <p>Zahvaljujemo se vam za vašo prijavo, ki smo jo uspešno prejeli.</p>
    </div>
  </main>

  <script src="assets/script.js"></script>
</body>
</html>
